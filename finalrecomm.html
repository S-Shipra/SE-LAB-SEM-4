<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodTunes - Music for Your Mood</title>
    <style>
        :root {
            --primary: #1DB954;
            --dark: #191414;
            --light: #FFFFFF;
            --gray: #F2F2F2;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--gray);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--dark);
            color: var(--light);
            padding: 20px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .mood-form {
            background-color: var(--light);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            background-color: var(--primary);
            color: var(--light);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        button:hover {
            background-color: #1ed760;
        }
        
        .results {
            display: none;
            background-color: var(--light);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .song-list {
            margin-top: 20px;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .song-item:hover {
            background-color: #f9f9f9;
        }
        
        .song-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            margin-right: 20px;
            border-radius: 4px;
        }
        
        .song-info {
            flex-grow: 1;
        }
        
        .song-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .song-artist {
            color: #666;
            font-size: 0.9rem;
        }
        
        .now-playing {
            display: none;
            background-color: var(--dark);
            color: var(--light);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            text-align: center;
        }
        
        .now-playing img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .player-controls {
            margin-top: 20px;
        }
        
        .player-controls button {
            width: auto;
            margin: 0 10px;
            padding: 10px 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .mood-form, .results {
                padding: 20px;
            }
            
            .now-playing img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>MoodTunes</h1>
            <p class="tagline">Music that matches your mood</p>
        </div>
    </header>
    
    <div class="container">
        <div class="mood-form">
            <h2>How are you feeling today?</h2>
            <form id="moodForm">
                <div class="form-group">
                    <label for="mood">Select your current mood:</label>
                    <select id="mood" required>
                        <option value="">-- Select a mood --</option>
                        <option value="happy">Happy 😊</option>
                        <option value="sad">Sad 😢</option>
                        <option value="angry">Angry 😠</option>
                        <option value="relaxed">Relaxed 😌</option>
                        <option value="energetic">Energetic ⚡</option>
                        <option value="romantic">Romantic ❤️</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="sentiment">Sentiment score (0-100):</label>
                    <input type="number" id="sentiment" min="0" max="100" placeholder="Enter a score between 0-100" required>
                </div>
                
                <button type="submit">Get Music Recommendations</button>
            </form>
        </div>
        
        <div class="results" id="results">
            <h2>Recommended Songs</h2>
            <div class="song-list" id="songList">
                <!-- Songs will be populated here -->
            </div>
        </div>
        
        <div class="now-playing" id="nowPlaying">
            <h2>Now Playing</h2>
            <img id="nowPlayingImage" src="" alt="Album cover">
            <h3 id="nowPlayingTitle">Song Title</h3>
            <p id="nowPlayingArtist">Artist Name</p>
            
            <div class="player-controls">
                <button id="playPauseBtn">Pause</button>
                <button id="stopBtn">Stop</button>
            </div>
        </div>
    </div>
    
    <script>
        // Mood to genre mapping
        const moodToGenres = {

            sad: ["sad", "blues", "acoustic", "rainy-day"],
            angry: ["rock", "metal", "hardcore", "punk"],
            relaxed: ["chill", "ambient", "jazz", "classical"],
            energetic: ["work-out", "electronic", "edm", "hip-hop"],
            romantic: ["romance", "r&b", "love", "dinner"]
        };
        
        // Sample song database (in a real app, you'd use Spotify API)
        const songDatabase = {
            happy: [
                {id: "7qiZfU4dY1lWllzX7mPBI3", title: "Shape of You", artist: "Ed Sheeran", image: "https://i.scdn.co/image/ab67616d0000b273d9e6d98a1023a1a0a82226b3"},
                {id: "1r9xUipOqoNwggBpENDsvJ", title: "Uptown Funk", artist: "Bruno Mars", image: "https://i.scdn.co/image/ab67616d0000b2738093238ec1366a6d96579518"},
                {id: "6fujklziTHa8uoM5OQSfIo", title: "Can't Stop the Feeling!", artist: "Justin Timberlake", image: "https://i.scdn.co/image/ab67616d0000b273d9194aa18fa4c9362b47464f"}
            ],
            sad: [
                {id: "3ERIk9f6kLfOEp78yX1Pm6", title: "Someone Like You", artist: "Adele", image: "https://i.scdn.co/image/ab67616d0000b273e2d156fdc691f57900134342"},
                {id: "4Dvkj6JhhA12EX05fT7y2e", title: "Hurt", artist: "Johnny Cash", image: "https://i.scdn.co/image/ab67616d0000b2730f5c597bba60a1a7b904a9b1"},
                {id: "6G7ZrHD6tX7a4qNwSekhZW", title: "Everybody Hurts", artist: "R.E.M.", image: "https://i.scdn.co/image/ab67616d0000b2739a9716c90ceeb1890921e44f"}
            ],
            angry: [
    {id: "3fjtZV7YzUD7j5i6gWCC88", title: "Enter Sandman", artist: "Metallica", image: "https://i.scdn.co/image/ab67616d0000b273cf84c5b276431b473e924802"},
    {id: "5N4sKR4J4oYmsXitcRlJxM", title: "Chop Suey!", artist: "System Of A Down", image: "https://i.scdn.co/image/ab67616d0000b273b1d6b4d39cd7b65f875c7d8c"},
    {id: "3YfS47QufnLDFA9A7E4dQB", title: "Last Resort", artist: "Papa Roach", image: "https://i.scdn.co/image/ab67616d0000b273a1a6d5b20c9c3577b3a0f9c8"},
    {id: "2SkmWwtSGBlYxR9QeKvq10", title: "Du hast", artist: "Rammstein", image: "https://i.scdn.co/image/ab67616d0000b273ea7ca9f069c1a1d3a2a3a20a"},

],
            relaxed: [
                {id: "7xGfFoTpQ2E7fRF5lN10tr", title: "Weightless", artist: "Marconi Union", image: "https://i.scdn.co/image/ab67616d0000b2738e49866860dcb5c26a4b6f6e"},

            energetic: [
                {id: "7gSQv1OHpkIoAdUiRLdmI6", title: "Eye of the Tiger", artist: "Survivor", image: "https://i.scdn.co/image/ab67616d0000b273e31a37a3d30e248a436a1a3d"},
                {id: "7GhIk7Il098yCjg4BQjzvb", title: "Lose Yourself", artist: "Eminem", image: "https://i.scdn.co/image/ab67616d0000b2738e49866860dcb5c26a4b6f6e"},
                {id: "5UqCQaDshqbIk3pkhy4Pjg", title: "Titanium", artist: "David Guetta ft. Sia", image: "https://i.scdn.co/image/ab67616d0000b2738e49866860dcb5c26a4b6f6e"}
            ],
            romantic: [
                {id: "4iJyoBOLtHqaGxP12qzhQI", title: "Perfect", artist: "Ed Sheeran", image: "https://i.scdn.co/image/ab67616d0000b273ba5db46f4b838ef6027e6f96"},
                {id: "6b2oQwSGFkzsMtQruIWm2p", title: "All of Me", artist: "John Legend", image: "https://i.scdn.co/image/ab67616d0000b2739e7dad80eb4bb664ff9e6fc8"},
                {id: "4uLU6hMCjMI75M1A2tKUQC", title: "Thinking Out Loud", artist: "Ed Sheeran", image: "https://i.scdn.co/image/ab67616d0000b273f7b7174bef6f3fbfda3a0bb7"}
            ]
        };
        
        // Form submission
        document.getElementById('moodForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const mood = document.getElementById('mood').value;
            const sentiment = parseInt(document.getElementById('sentiment').value);
            
            // In a real app, you would adjust recommendations based on sentiment score
            // Here we'll just use the mood for simplicity
            
            if (songDatabase[mood]) {
                displaySongs(songDatabase[mood]);
                document.getElementById('results').style.display = 'block';
            }
        });
        
        // Display songs in the UI
        function displaySongs(songs) {
            const songList = document.getElementById('songList');
            songList.innerHTML = '';
            
            songs.forEach(song => {
                const songItem = document.createElement('div');
                songItem.className = 'song-item';
                songItem.innerHTML = `
                    <img src="${song.image}" alt="${song.title}">
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                `;
                
                songItem.addEventListener('click', () => playSong(song));
                songList.appendChild(songItem);
            });
        }
        
        // Play song function (simplified - in a real app you'd use Spotify Web Playback SDK)
        function playSong(song) 
        {
  // Spotify URI format: spotify:track:{id}
  const spotifyUri = `spotify:track:${song.id}`;
  
  // Try to open the Spotify app directly
  window.location.href = spotifyUri;
  
  // Fallback: Open web player if app isn't installed
  setTimeout(() => {
    window.open(`https://open.spotify.com/track/${song.id}`, '_blank');
  }, 200);
}
        
        // Player controls
        document.getElementById('playPauseBtn').addEventListener('click', function() {
            console.log('Play/Pause button clicked');
            // Implement play/pause functionality with Spotify API
        });
        
        document.getElementById('stopBtn').addEventListener('click', function() {
            console.log('Stop button clicked');
            // Implement stop functionality with Spotify API
        });
    </script>
</body>
</html>

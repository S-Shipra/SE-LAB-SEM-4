<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mental Health News</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Mental Health News with Sentiment Analysis</h1>
    {% for article in articles %}
    <div class="card">
        <img src="{{ article.image }}" alt="No Image" class="thumbnail">
        <h2><a href="{{ article.url }}" target="_blank">{{ article.title }}</a></h2>
        <p>{{ article.content }}...</p>
        <p><strong>Sentiment:</strong> {{ article.sentiment }} (Score: {{ article.score }})</p>
        <p><strong>Emotions Detected:</strong> {{ article.emotions }}</p>
    </div>
    {% endfor %}
</body>
</html>
